[package]
name = "mdv"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "A light, fast, native markdown viewer/editor"
repository = "https://github.com/makzumi/MDV"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
egui-phosphor = "0.14"
egui_extras = { version = "0.36", default-features = false, features = ["file", "http", "image", "svg", "gif", "webp"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pulldown-cmark = { version = "0.13", default-features = false }
rfd = "0.18"

# Embeds the icon + version info into the Windows .exe (only runs on Windows hosts).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Keep debug builds snappy enough to use while developing.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }
